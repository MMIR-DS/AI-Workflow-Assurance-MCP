[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-workflow-assurance-mcp"
version = "0.1.4"
description = "MCP server for deterministic acceptance testing of AI-enabled business workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI Workflow Assurance contributors" }]
keywords = ["mcp", "ai-agents", "evaluation", "workflow", "assurance", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["mcp>=2.0.0,<3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11", "mcp[cli]>=2.0.0,<3.0.0"]

[project.scripts]
ai-workflow-assurance-mcp = "ai_workflow_assurance_mcp.server:main"
ai-workflow-assurance = "ai_workflow_assurance_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workflow_assurance_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
