name: Independent tau2 RetailDB state verification (no model calls)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/verify_tau2_independent_db.py"
      - "scripts/adapt_tau2_db_evidence.py"
      - "scripts/redact_tau2_db_report.py"
      - "tests/test_tau2_db_report_redaction.py"
      - "tests/test_tau2_evidence_manifest.py"
      - "docs/TAU2_SOURCE_EVIDENCE_MANIFEST.md"
      - "tests/test_tau2_adapter.py"
      - "tests/fixtures/tau2_task0_trace_minimal.json"
      - ".github/workflows/awa-independent-db-check.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/verify_tau2_independent_db.py"
      - "scripts/adapt_tau2_db_evidence.py"
      - "scripts/redact_tau2_db_report.py"
      - "tests/test_tau2_db_report_redaction.py"
      - "tests/test_tau2_evidence_manifest.py"
      - "docs/TAU2_SOURCE_EVIDENCE_MANIFEST.md"
      - "tests/test_tau2_adapter.py"
      - "tests/fixtures/tau2_task0_trace_minimal.json"
      - ".github/workflows/awa-independent-db-check.yml"

permissions:
  contents: read

jobs:
  independent-db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check out tau2-bench at the pinned baseline commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sierra-research/tau2-bench
          ref: 4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699
          path: tau2-bench
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: tau2-bench
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install pinned tau2-bench runtime
        working-directory: tau2-bench
        run: uv sync --extra dev
      - name: Install missing optional import used by tau2 package initialization
        working-directory: tau2-bench
        run: uv pip install --python .venv/bin/python websockets
      - name: Load committed task-0 fixture (deterministic; no artifact dependency)
        run: |
          TRACE_FILE="tests/fixtures/tau2_task0_trace_minimal.json"
          TRACE_SOURCE="committed_minimal_fixture"
          python - "$TRACE_FILE" "$TRACE_SOURCE" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          results = json.loads(path.read_text(encoding="utf-8"))
          source_commit = str((results.get("info") or {}).get("git_commit") or "")
          if not source_commit:
              raise SystemExit("Trace does not declare info.git_commit.")
          print(f"Loaded {sys.argv[2]}: {path}; bytes={path.stat().st_size}; trace_source_commit={source_commit}")
          PY
          echo "TRACE_FILE=$TRACE_FILE" >> "$GITHUB_ENV"
          echo "TRACE_SOURCE=$TRACE_SOURCE" >> "$GITHUB_ENV"
      - name: Replay the write against a clean RetailDB and compare direct state
        working-directory: tau2-bench
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          uv run python ../scripts/verify_tau2_independent_db.py \
            --results "$GITHUB_WORKSPACE/$TRACE_FILE" \
            --output "$GITHUB_WORKSPACE/awa-independent-db-report.json" \
            --source-commit "$SOURCE_COMMIT"
      - name: Enforce independent database decision
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("awa-independent-db-report.json").read_text(encoding="utf-8"))
          assert report["decision"] == "GO", report
          assert report["checks"]["pre_state_matches_recorded_order_read"] is True, report
          assert report["checks"]["no_other_database_entities_mutated"] is True, report
          assert report["checks"]["independent_db_state_matches_recorded_exchange_response"] is True, report
          assert report["checks"]["replay_db_payment_profile_and_original_transaction_match"] is True, report
          assert report["checks"]["tamper_probe_is_detected"] is True, report
          assert report["summary"]["passed_checks"] == report["summary"]["total_checks"], report
          print(json.dumps({
              "trace_source": os.environ.get("TRACE_SOURCE"),
              "decision": report["decision"],
              "summary": report["summary"],
              "checks": report["checks"]
          }, indent=2))
          PY
      - name: Package replay report as source evidence manifest
        run: |
          python scripts/adapt_tau2_db_evidence.py \
            --report awa-independent-db-report.json \
            --output awa-source-evidence-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("awa-source-evidence-manifest.json").read_text(encoding="utf-8"))
          assert manifest["decision"] == "GO", manifest
          assert manifest["production_ready"] is False, manifest
          assert manifest["release_eligible"] is False, manifest
          assert manifest["assurance_scope"] == "pinned_simulator_replay_evidence_only", manifest
          assert manifest["source_provenance"]["source_commit_match"] is True, manifest
          assert manifest["database_evidence"]["tool_return_value_used_for_decision"] is False, manifest
          assert all(manifest["checks"].values()), manifest
          print(json.dumps({
              "manifest_type": manifest["manifest_type"],
              "decision": manifest["decision"],
              "summary": manifest["summary"],
              "production_ready": manifest["production_ready"],
          }, indent=2))
          PY
      - name: Redact customer and payment details before artifact upload
        run: |
          python scripts/redact_tau2_db_report.py \
            --input awa-independent-db-report.json \
            --output awa-independent-db-report-public.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("awa-independent-db-report-public.json").read_text(encoding="utf-8"))
          evidence = report["database_evidence"]
          assert report["artifact_redaction"]["applied"] is True, report
          assert evidence["redaction"]["raw_order_snapshots_included"] is False, report
          for key in ("before", "after", "recorded_before", "recorded_after"):
              snapshot = evidence[key]
              for forbidden in ("address", "user_id", "fulfillments", "payment_history", "exchange_payment_method_id", "return_payment_method_id"):
                  assert forbidden not in snapshot, {"snapshot": key, "field": forbidden}
          assert "write_execution_error" not in evidence, report
          print("Public evidence report redaction checks passed.")
          PY
      - name: Upload independent database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awa-independent-retail-db-evidence
          path: |
            awa-independent-db-report-public.json
            awa-source-evidence-manifest.json
          if-no-files-found: warn
          retention-days: 14
