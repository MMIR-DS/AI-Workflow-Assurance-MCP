name: Keyless Local Model Lab

# Manual-only: model downloads and CPU inference consume runner time.
on:
  workflow_dispatch:
    inputs:
      run_tool_probe:
        description: "Probe structured tool-call output"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: keyless-local-model-lab
  cancel-in-progress: false

jobs:
  local-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_PATH: ${{ runner.temp }}/qwen2.5-0.5b-instruct-q4_k_m.gguf
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/2ed9be962c95f7625f4963ff51ed472e4538187a/qwen2.5-0.5b-instruct-q4_k_m.gguf
      LOCAL_MODEL_URL: http://127.0.0.1:8000/v1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local CPU inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python==0.3.16" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Download public model without credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 "$MODEL_URL" --output "$MODEL_PATH"
          test -s "$MODEL_PATH"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $MODEL_PATH" | sha256sum --check -
          sha256sum "$MODEL_PATH" | tee "${{ runner.temp }}/model-sha256.txt"
      - name: Start loopback-only model server
        shell: bash
        run: |
          set -euo pipefail
          nohup python -m llama_cpp.server --model "$MODEL_PATH" --model_alias keyless-qwen --host 127.0.0.1 --port 8000 --n_ctx 4096 --n_threads 2 --n_gpu_layers 0 --chat_format chatml > "${{ runner.temp }}/llama-server.log" 2>&1 &
          echo $! > "${{ runner.temp }}/llama-server.pid"
          for attempt in $(seq 1 90); do
            if curl --silent --fail "$LOCAL_MODEL_URL/models" >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "${{ runner.temp }}/llama-server.pid")" 2>/dev/null; then
              cat "${{ runner.temp }}/llama-server.log"
              exit 1
            fi
            sleep 2
          done
          cat "${{ runner.temp }}/llama-server.log"
          exit 1
      - name: Probe inference and optional tool-call schema
        env:
          RUN_TOOL_PROBE: ${{ inputs.run_tool_probe }}
          REPORT_PATH: ${{ runner.temp }}/keyless-model-report.json
          MODEL_SHA_PATH: ${{ runner.temp }}/model-sha256.txt
        run: python scripts/keyless_model_probe.py
      - name: Run offline assurance suite separately
        run: python -m pytest tests/test_tau2_offline_scenario_suite.py
      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if test -f "${{ runner.temp }}/llama-server.pid"; then
            kill "$(cat "${{ runner.temp }}/llama-server.pid")" 2>/dev/null || true
          fi
      - name: Upload lab report, model hash, and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyless-local-model-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keyless-model-report.json
            ${{ runner.temp }}/model-sha256.txt
            ${{ runner.temp }}/llama-server.log
          if-no-files-found: warn
          retention-days: 14
