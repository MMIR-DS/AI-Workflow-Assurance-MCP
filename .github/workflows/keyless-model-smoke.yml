name: Keyless Local Model Lab

# Run on relevant pushes to this isolated lab branch, or manually once on the default branch.
# The path filter avoids rerunning the model download for documentation-only edits.
on:
  push:
    branches:
      - feat/keyless-local-model-lab-main
    paths:
      - '.github/workflows/keyless-model-smoke.yml'
      - 'scripts/keyless_model_probe.py'
      - 'tests/test_keyless_model_probe.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      run_tool_probe:
        description: "Probe structured tool-call output"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: keyless-local-model-lab
  cancel-in-progress: false

jobs:
  local-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/2ed9be962c95f7625f4963ff51ed472e4538187a/qwen2.5-0.5b-instruct-q4_k_m.gguf
      LOCAL_MODEL_URL: http://127.0.0.1:8000/v1
      CHAT_FORMAT: chatml-function-calling
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install local CPU inference runtime and server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python[server]==0.3.16" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install -e ".[dev]"
          python -c "import fastapi, uvicorn; import llama_cpp; print('llama-cpp-python server dependencies import successfully')"
      - name: Download public model without credentials
        shell: bash
        env:
          MODEL_PATH: ${{ runner.temp }}/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 "$MODEL_URL" --output "$MODEL_PATH"
          test -s "$MODEL_PATH"
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $MODEL_PATH" | sha256sum --check -
          sha256sum "$MODEL_PATH" | tee "${{ runner.temp }}/model-sha256.txt"
      - name: Start loopback-only model server
        shell: bash
        env:
          MODEL_PATH: ${{ runner.temp }}/qwen2.5-0.5b-instruct-q4_k_m.gguf
        run: |
          set -euo pipefail
          # Use llama-cpp-python's generic function-calling formatter so the probe tests tool-call serialization, not plain chat formatting.
          nohup python -m llama_cpp.server --model "$MODEL_PATH" --model_alias keyless-qwen --host 127.0.0.1 --port 8000 --n_ctx 4096 --n_threads 2 --n_gpu_layers 0 --chat_format "$CHAT_FORMAT" > "${{ runner.temp }}/llama-server.log" 2>&1 &
          echo $! > "${{ runner.temp }}/llama-server.pid"
          for attempt in $(seq 1 90); do
            if curl --silent --fail "$LOCAL_MODEL_URL/models" >/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "${{ runner.temp }}/llama-server.pid")" 2>/dev/null; then
              cat "${{ runner.temp }}/llama-server.log"
              exit 1
            fi
            sleep 2
          done
          cat "${{ runner.temp }}/llama-server.log"
          exit 1
      - name: Probe inference and optional tool-call schema
        env:
          RUN_TOOL_PROBE: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tool_probe }}
          REPORT_PATH: ${{ runner.temp }}/keyless-model-report.json
          MODEL_SHA_PATH: ${{ runner.temp }}/model-sha256.txt
        run: python scripts/keyless_model_probe.py
      - name: Test probe report and no-tool-execution contract
        run: python -m pytest tests/test_keyless_model_probe.py
      - name: Run repository test suite separately from model inference
        run: python -m pytest tests
      - name: Stop local server
        if: always()
        shell: bash
        run: |
          if test -f "${{ runner.temp }}/llama-server.pid"; then
            kill "$(cat "${{ runner.temp }}/llama-server.pid")" 2>/dev/null || true
          fi
      - name: Upload lab report, model hash, and server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyless-local-model-lab-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keyless-model-report.json
            ${{ runner.temp }}/model-sha256.txt
            ${{ runner.temp }}/llama-server.log
          if-no-files-found: warn
          retention-days: 14
