name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Expand embedded legacy tests for source review
        if: matrix.python-version == '3.10'
        run: |
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          text = Path("tests/test_core.py").read_text(encoding="utf-8")
          start = text.index('"""', text.index("base64.b64decode(")) + 3
          end = text.index('""".encode("ascii")', start)
          decoded = zlib.decompress(base64.b64decode(text[start:end])).decode("utf-8")
          Path("tmp-legacy-test-core-expanded.py").write_text(decoded, encoding="utf-8")
          print(f"Expanded source bytes: {len(decoded.encode('utf-8'))}")
          print("\n".join(decoded.splitlines()[:8]))
          PY
      - name: Upload expanded legacy test source
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-test-core-expanded
          path: tmp-legacy-test-core-expanded.py
          retention-days: 1
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check src tests scripts
