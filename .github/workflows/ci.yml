name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check src tests scripts
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/awa-wheel-venv"
          "$RUNNER_TEMP/awa-wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance" --help
          "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance" validate-spec --spec examples/invoice_matching/workflow.json
      - name: Verify release gate accepts GO and rejects non-GO
        run: |
          CLI="$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance"
          SPEC="examples/invoice_matching/workflow.json"
          "$CLI" release --spec "$SPEC" --cases examples/invoice_matching/cases_candidate.json --output "$RUNNER_TEMP/awa-go.json" --fail-on-non-go
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-go.json').read_text()); assert p['decision'] == 'GO', p['decision']"
          if "$CLI" release --spec "$SPEC" --cases examples/invoice_matching/cases_baseline.json --output "$RUNNER_TEMP/awa-non-go.json" --fail-on-non-go; then
            echo "Expected the intentionally failing baseline to block the release."
            exit 1
          fi
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-non-go.json').read_text()); assert p['decision'] != 'GO', p['decision']"
      - name: Smoke-test retail exchange evidence adapter
        run: |
          python scripts/adapt_retail_exchange_observation.py --observation examples/retail_exchange_observation_v1.json --spec examples/tau2_retail_workflow.json --output-dir "$RUNNER_TEMP/retail-exchange-demo"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/retail-exchange-demo/awa_release_report.json').read_text()); assert p['decision'] == 'GO', p['decision']"
      - name: Run source-code mutation smoke test
        run: python scripts/run_source_mutation_smoke.py --output "artifacts/mutation-report-python-${{ matrix.python-version }}.json"
      - name: Upload source mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-mutation-report-python-${{ matrix.python-version }}
          path: artifacts/mutation-report-python-${{ matrix.python-version }}.json
          if-no-files-found: ignore
