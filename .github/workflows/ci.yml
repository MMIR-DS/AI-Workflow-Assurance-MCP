name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run deterministic assurance mutation harness
        run: |
          python scripts/run_assurance_mutation_harness.py > "$RUNNER_TEMP/awa-harness.json"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-harness.json').read_text()); assert p['overall_passed'] is True, p"
          python -m unittest tests.test_mutation_harness
      - name: Lint
        run: |
          ruff check --fix src/ai_workflow_assurance_mcp/core.py || true
          git diff -- src/ai_workflow_assurance_mcp/core.py
          ruff check src tests scripts
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/awa-wheel-venv"
          "$RUNNER_TEMP/awa-wheel-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/awa-wheel-venv/bin/python" scripts/check_installed_wheel_origin.py \
            --python "$RUNNER_TEMP/awa-wheel-venv/bin/python" \
            --cli "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance" \
            --server "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance-mcp" \
            > "$RUNNER_TEMP/awa-wheel-origin.json"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-wheel-origin.json').read_text()); assert p['status'] == 'passed' and p['import_from_installed_package'] is True and p['metadata_version'] == p['package_version'], p"
          "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance" --help
          "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance" validate-spec --spec examples/invoice_matching/workflow.json
      - name: Smoke-test MCP stdio from the installed wheel
        run: |
          "$RUNNER_TEMP/awa-wheel-venv/bin/python" scripts/smoke_installed_wheel_mcp_stdio.py \
            --server "$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance-mcp" \
            > "$RUNNER_TEMP/awa-mcp-smoke.json"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-mcp-smoke.json').read_text()); assert p['passed'] is True and p['listed_tool_count'] == 8 and p['model_calls'] == 0 and p['network_guard_active'] is True and p['blocked_network_attempts'] == 0, p"
      - name: Verify documented CLI acceptance commands
        run: |
          CLI="$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance"
          SPEC="examples/invoice_matching/workflow.json"
          "$CLI" validate-spec --spec "$SPEC" --output "$RUNNER_TEMP/awa-validate.json"
          "$CLI" evaluate --spec "$SPEC" --cases examples/invoice_matching/cases_candidate.json --summary-only --output "$RUNNER_TEMP/awa-evaluate.json"
          "$CLI" compare --spec "$SPEC" --baseline examples/invoice_matching/cases_baseline.json --candidate examples/invoice_matching/cases_candidate.json --output "$RUNNER_TEMP/awa-compare.json"
          "$CLI" explain --spec "$SPEC" --cases examples/invoice_matching/cases_baseline.json --max-items 10 --output "$RUNNER_TEMP/awa-explain.json"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-validate.json').read_text()); assert p['valid'] is True, p"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-evaluate.json').read_text()); assert p['case_results_omitted'] is True and 'case_results' not in p and p['summary']['pass_rate'] == 1.0, p"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-compare.json').read_text()); assert p['workflow_id'] == 'invoice-match' and 'overall_trend' in p, p"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-explain.json').read_text()); assert p['failures_returned'] <= 10 and 'failure_groups' in p, p"
      - name: Verify release gate accepts GO and rejects non-GO
        run: |
          CLI="$RUNNER_TEMP/awa-wheel-venv/bin/ai-workflow-assurance"
          SPEC="examples/invoice_matching/workflow.json"
          "$CLI" release --spec "$SPEC" --cases examples/invoice_matching/cases_candidate.json --output "$RUNNER_TEMP/awa-go.json" --fail-on-non-go
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-go.json').read_text()); assert p['decision'] == 'GO', p['decision']"
          if "$CLI" release --spec "$SPEC" --cases examples/invoice_matching/cases_baseline.json --output "$RUNNER_TEMP/awa-non-go.json" --fail-on-non-go; then
            echo "Expected the intentionally failing baseline to block the release."
            exit 1
          fi
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/awa-non-go.json').read_text()); assert p['decision'] != 'GO', p['decision']"
      - name: Smoke-test retail exchange evidence adapter
        run: |
          python scripts/adapt_retail_exchange_observation.py --observation examples/retail_exchange_observation_v1.json --spec examples/tau2_retail_workflow.json --output-dir "$RUNNER_TEMP/retail-exchange-demo"
          python -c "import json, pathlib; p=json.loads(pathlib.Path('$RUNNER_TEMP/retail-exchange-demo/awa_release_report.json').read_text()); assert p['decision'] == 'GO', p['decision']"
      - name: Run source-code mutation smoke test
        run: python scripts/run_source_mutation_smoke.py --output "artifacts/mutation-report-python-${{ matrix.python-version }}.json"
      - name: Upload source mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-mutation-report-python-${{ matrix.python-version }}
          path: artifacts/mutation-report-python-${{ matrix.python-version }}.json
          if-no-files-found: ignore
      - name: Upload CLI acceptance outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-acceptance-outputs-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/awa-validate.json
            ${{ runner.temp }}/awa-evaluate.json
            ${{ runner.temp }}/awa-compare.json
            ${{ runner.temp }}/awa-explain.json
            ${{ runner.temp }}/awa-go.json
            ${{ runner.temp }}/awa-non-go.json
            ${{ runner.temp }}/retail-exchange-demo/awa_release_report.json
          if-no-files-found: warn
          retention-days: 14

  windows-mcp-smoke:
    name: Windows installed-wheel MCP smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and install into a clean Windows virtual environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip wheel . --no-deps --wheel-dir dist
          if ($LASTEXITCODE -ne 0) { throw "Wheel build failed." }

          $venv = Join-Path $env:RUNNER_TEMP "awa-wheel-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed." }

          $wheel = Get-ChildItem -Path dist -Filter "ai_workflow_assurance_mcp-*.whl" | Select-Object -First 1
          if (-not $wheel) { throw "Built wheel not found." }

          $python = Join-Path $venv "Scripts\python.exe"
          $cli = Join-Path $venv "Scripts\ai-workflow-assurance.exe"
          $server = Join-Path $venv "Scripts\ai-workflow-assurance-mcp.exe"

          & $python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "Wheel installation failed." }
          "WHEEL=$($wheel.Name)" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP "awa-build-info.txt") -Encoding utf8
      - name: Verify installed-wheel origin on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TEMP "awa-wheel-venv"
          $python = Join-Path $venv "Scripts\python.exe"
          $cli = Join-Path $venv "Scripts\ai-workflow-assurance.exe"
          $server = Join-Path $venv "Scripts\ai-workflow-assurance-mcp.exe"
          $reportPath = Join-Path $env:RUNNER_TEMP "awa-windows-wheel-origin.json"

          & $python scripts/check_installed_wheel_origin.py --python $python --cli $cli --server $server > $reportPath
          if ($LASTEXITCODE -ne 0) { throw "Installed-wheel origin check failed." }

          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if ($report.status -ne "passed" -or
              $report.import_from_installed_package -ne $true -or
              $report.metadata_version -ne $report.package_version) {
            throw "Installed-wheel origin contract failed: $($report | ConvertTo-Json -Depth 8)"
          }
          Write-Host ($report | ConvertTo-Json -Depth 8)
      - name: Exercise MCP handshake, tool discovery, and all tool contracts over Windows stdio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TEMP "awa-wheel-venv"
          $python = Join-Path $venv "Scripts\python.exe"
          $server = Join-Path $venv "Scripts\ai-workflow-assurance-mcp.exe"
          $reportPath = Join-Path $env:RUNNER_TEMP "awa-windows-mcp-smoke.json"

          & $python scripts/smoke_installed_wheel_mcp_stdio.py --server $server > $reportPath
          if ($LASTEXITCODE -ne 0) {
            Get-Content -Raw $reportPath
            throw "Windows installed-wheel MCP stdio smoke failed."
          }

          $report = Get-Content -Raw $reportPath | ConvertFrom-Json
          if ($report.passed -ne $true -or
              $report.listed_tool_count -ne 8 -or
              $report.model_calls -ne 0 -or
              $report.network_guard_active -ne $true -or
              $report.blocked_network_attempts -ne 0) {
            throw "Windows MCP smoke contract failed: $($report | ConvertTo-Json -Depth 12)"
          }
          Write-Host ($report | ConvertTo-Json -Depth 12)
      - name: Upload Windows MCP smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-wheel-mcp-smoke
          path: ${{ runner.temp }}\awa-windows-mcp-smoke.json
          if-no-files-found: warn

