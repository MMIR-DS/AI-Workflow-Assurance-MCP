name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check src tests scripts
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test built wheel outside the source tree
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/awa-wheel-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/awa-wheel-install" "$RUNNER_TEMP/awa-wheel-install/bin/ai-workflow-assurance" --help
      - name: Run source-code mutation smoke test
        run: python scripts/run_source_mutation_smoke.py
