name: tau2 retail + AWA assurance prototype (bounded)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "LiteLLM model identifier for OpenRouter"
        required: true
        default: "openrouter/google/gemini-2.5-flash"
        type: string
      max_steps:
        description: "Maximum agent turns; keeps the trial bounded"
        required: true
        default: "20"
        type: choice
        options: ["20", "40", "60"]
      max_tokens:
        description: "Maximum output tokens per model response; lower values need less reserved credit"
        required: true
        default: "1024"
        type: choice
        options: ["320", "384", "512", "1024", "1280", "2048"]

permissions:
  contents: read

concurrency:
  group: tau2-retail-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_BASE: https://openrouter.ai/api/v1
      MODEL: ${{ inputs.model || 'openrouter/google/gemini-2.5-flash' }}
      MAX_STEPS: ${{ inputs.max_steps || '20' }}
      MAX_TOKENS: ${{ inputs.max_tokens || '1024' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check out public tau2-bench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sierra-research/tau2-bench
          ref: 4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699
          path: tau2-bench
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: tau2-bench
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
      - name: Install tau2-bench
        working-directory: tau2-bench
        run: uv sync --extra dev
      - name: Install missing runtime dependency used by tau2 data checks
        working-directory: tau2-bench
        run: uv pip install --python .venv/bin/python 'websockets==15.0.1'
      - name: Disable hidden LiteLLM retries for bounded OpenRouter smoke
        working-directory: tau2-bench
        run: python ../scripts/patch_tau2_litellm_retries.py --tau2-root .
      - name: Apply reviewed retail lookup guidance to pinned Tau2 agent
        working-directory: tau2-bench
        run: python ../scripts/patch_tau2_retail_agent_prompt.py --tau2-root .
      - name: Limit agent tool schemas to the pinned retail task-0 allowlist
        working-directory: tau2-bench
        run: python ../scripts/patch_tau2_retail_tool_allowlist.py --tau2-root .
      - name: Install AWA pre-write guard into pinned Tau2 dispatch path
        working-directory: tau2-bench
        run: python ../scripts/install_tau2_prewrite_guard.py --tau2-root .
      - name: Verify NO_GO blocks the actual Tau2 dispatch callback (no model calls)
        working-directory: tau2-bench
        run: PYTHONPATH="../src${PYTHONPATH:+:$PYTHONPATH}" uv run python ../scripts/smoke_test_tau2_prewrite_guard.py
      - name: Check required secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Missing repository secret OPENROUTER_API_KEY"
            exit 1
          fi
      - name: Validate benchmark data
        working-directory: tau2-bench
        run: uv run tau2 check-data
      - name: Run one retail task and one trial (bounded; tau2 only)
        id: tau2_run
        working-directory: tau2-bench
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAU2_LITELLM_NUM_RETRIES: "0"
        shell: bash
        run: bash ../scripts/run_tau2_retail_smoke.sh
      - name: Generate AWA case, evaluation, and release reports when results exist
        if: always() && hashFiles('tau2-bench/data/simulations/tau2-standalone-retail-task0/results.json') != ''
        run: |
          PYTHONPATH=src python scripts/adapt_tau2_results.py \
            --results tau2-bench/data/simulations/tau2-standalone-retail-task0/results.json \
            --spec examples/tau2_retail_workflow.json \
            --output-dir awa-adapter-output
      - name: Write operational execution status
        if: always()
        env:
          TAU2_OUTCOME: ${{ steps.tau2_run.outcome }}
        run: |
          python scripts/write_tau2_execution_status.py \
            --tau2-outcome "$TAU2_OUTCOME" \
            --log tau2-benchmark.log \
            --results tau2-bench/data/simulations/tau2-standalone-retail-task0/results.json \
            --release-report awa-adapter-output/awa_release_report.json \
            --output tau2-execution-status.json
      - name: Preserve trace, result, logs, and operational status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tau2-awa-retail-assurance
          path: |
            tau2-bench/data/simulations/**
            awa-adapter-output/**
            tau2-benchmark.log
            tau2-execution-status.json
          if-no-files-found: warn
          retention-days: 14
