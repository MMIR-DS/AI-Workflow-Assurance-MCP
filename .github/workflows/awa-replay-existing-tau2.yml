name: Replay saved tau2 trace through AWA — independent seven-mutation suite (no model calls)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/adapt_tau2_results.py"
      - "scripts/verify_tau2_mutations.py"
      - "tests/test_tau2_adapter.py"
      - "tests/fixtures/tau2_task0_trace_minimal.json"
      - "examples/tau2_retail_workflow.json"
      - ".github/workflows/awa-replay-existing-tau2.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/adapt_tau2_results.py"
      - "scripts/verify_tau2_mutations.py"
      - "tests/test_tau2_adapter.py"
      - "tests/fixtures/tau2_task0_trace_minimal.json"
      - "examples/tau2_retail_workflow.json"
      - ".github/workflows/awa-replay-existing-tau2.yml"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install AWA and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Load deterministic committed task-0 fixture (no expiring artifact)
        run: |
          TRACE_FILE="tests/fixtures/tau2_task0_trace_minimal.json"
          TRACE_SOURCE="committed_minimal_fixture"
          python - "$TRACE_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          result = json.loads(path.read_text(encoding="utf-8"))
          sims = result.get("simulations")
          if not isinstance(sims, list) or len(sims) != 1:
              raise SystemExit("Expected exactly one tau2 simulation.")
          source_commit = str((result.get("info") or {}).get("git_commit") or "")
          if not source_commit:
              raise SystemExit("Fixture does not declare info.git_commit.")
          print(f"Loaded committed fixture: {path}; bytes={path.stat().st_size}; simulations={len(sims)}; task_id={sims[0].get('task_id')}; source_commit={source_commit}")
          PY
          echo "TRACE_FILE=$TRACE_FILE" >> "$GITHUB_ENV"
          echo "TRACE_SOURCE=$TRACE_SOURCE" >> "$GITHUB_ENV"
      - name: Generate baseline AWA reports and require pre-write fail-closed result
        run: |
          set +e
          PYTHONPATH=src python scripts/adapt_tau2_results.py \
            --results "$TRACE_FILE" \
            --spec examples/tau2_retail_workflow.json \
            --output-dir awa-baseline
          adapter_status=$?
          set -e
          python - "$adapter_status" <<'PY'
          import json
          import sys
          from pathlib import Path
          adapter_status = int(sys.argv[1])
          report = json.loads(Path("awa-baseline/awa_release_report.json").read_text(encoding="utf-8"))
          cases = json.loads(Path("awa-baseline/awa_cases.json").read_text(encoding="utf-8"))
          assert report["decision"] == "NO_GO", report
          assert adapter_status == 2, {"adapter_status": adapter_status, "decision": report["decision"]}
          assert cases[0]["actual"]["confirmation_policy_respected"] is False, cases[0]["actual"]
          print("Raw task-0 trace is correctly NO_GO: required pre-write disclosure is absent.")
          PY
      - name: Run seven independent raw-evidence mutation checks (no model calls)
        run: |
          PYTHONPATH=src python scripts/verify_tau2_mutations.py \
            --results "$TRACE_FILE" \
            --spec examples/tau2_retail_workflow.json \
            --output-dir awa-mutation-suite
      - name: Enforce raw-trace NO_GO and synthetic-control GO with all mutations NO_GO
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          baseline = json.loads(Path("awa-baseline/awa_release_report.json").read_text(encoding="utf-8"))
          summary = json.loads(Path("awa-mutation-suite/mutation_summary.json").read_text(encoding="utf-8"))
          baseline_case = json.loads(Path("awa-baseline/awa_cases.json").read_text(encoding="utf-8"))[0]
          assert baseline["decision"] == "NO_GO", baseline
          assert baseline_case["actual"]["confirmation_policy_respected"] is False, baseline_case["actual"]
          # The mutation harness builds a separate synthetic complete-confirmation control.
          assert summary["baseline_decision"] == "GO", summary
          assert summary["all_mutations_no_go"] is True, summary
          assert summary["tau2_oracle_unchanged_for_all_mutations"] is True, summary
          assert summary["mutation_count"] == 7, summary
          print(json.dumps({"trace_source": os.environ.get("TRACE_SOURCE"), "baseline": baseline["decision"], **summary}, indent=2))
          PY
      - name: Upload trace and AWA mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awa-independent-trace-mutation-suite
          path: |
            saved-tau2/**
            awa-baseline/**
            awa-mutation-suite/**
          if-no-files-found: warn
          retention-days: 14
