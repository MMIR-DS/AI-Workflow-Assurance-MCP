name: Replay saved tau2 trace through AWA — independent six-mutation suite (no model calls)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/awa-replay-existing-tau2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[replay-tau2-artifact]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AWA and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Load archived tau2 result or fall back to the committed task-0 fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run download 38047957343 \
            --repo MMIR-DS/AI-Workflow-Assurance-MCP \
            --name tau2-standalone-retail-smoke \
            --dir saved-tau2
          download_status=$?
          set -e
          TRACE_FILE="$(find saved-tau2 -type f -path '*/tau2-standalone-retail-task0/results.json' -print -quit 2>/dev/null)"
          if [ -z "$TRACE_FILE" ]; then
            echo "::warning::Archived result unavailable (status=$download_status); using committed minimized fixture."
            TRACE_FILE="saved-tau2/tau2-bench/data/simulations/tau2-standalone-retail-task0/results.json"
            mkdir -p "$(dirname "$TRACE_FILE")"
            cp tests/fixtures/tau2_task0_trace_minimal.json "$TRACE_FILE"
            TRACE_SOURCE="committed_minimal_fixture"
          else
            TRACE_SOURCE="archived_full_tau2_result"
          fi
          python - "$TRACE_FILE" "$TRACE_SOURCE" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          result = json.loads(path.read_text(encoding="utf-8"))
          sims = result.get("simulations")
          if not isinstance(sims, list) or len(sims) != 1:
              raise SystemExit("Expected exactly one tau2 simulation.")
          print(f"Loaded {sys.argv[2]}: {path}; bytes={path.stat().st_size}; simulations={len(sims)}; task_id={sims[0].get('task_id')}")
          PY
          echo "TRACE_FILE=$TRACE_FILE" >> "$GITHUB_ENV"
          echo "TRACE_SOURCE=$TRACE_SOURCE" >> "$GITHUB_ENV"
      - name: Generate baseline AWA reports from recorded tool outputs
        run: |
          PYTHONPATH=src python scripts/adapt_tau2_results.py \
            --results "$TRACE_FILE" \
            --spec examples/tau2_retail_workflow.json \
            --output-dir awa-baseline
      - name: Run six independent raw-evidence mutation checks (no model calls)
        run: |
          PYTHONPATH=src python scripts/verify_tau2_mutations.py \
            --results "$TRACE_FILE" \
            --spec examples/tau2_retail_workflow.json \
            --output-dir awa-mutation-suite
      - name: Enforce baseline GO and all mutated NO_GO outcomes
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          baseline = json.loads(Path("awa-baseline/awa_release_report.json").read_text(encoding="utf-8"))
          summary = json.loads(Path("awa-mutation-suite/mutation_summary.json").read_text(encoding="utf-8"))
          assert baseline["decision"] == "GO", baseline
          assert summary["all_mutations_no_go"] is True, summary
          assert summary["tau2_oracle_unchanged_for_all_mutations"] is True, summary
          assert summary["mutation_count"] == 6, summary
          print(json.dumps({"trace_source": os.environ.get("TRACE_SOURCE"), "baseline": baseline["decision"], **summary}, indent=2))
          PY
      - name: Upload trace and AWA mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awa-independent-trace-mutation-suite
          path: |
            saved-tau2/**
            awa-baseline/**
            awa-mutation-suite/**
          if-no-files-found: warn
          retention-days: 14
